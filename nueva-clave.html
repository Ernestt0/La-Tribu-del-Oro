<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Nueva contraseña - La Tribu del Oro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="styles.css?v=202611032209" />
    <link rel="stylesheet" href="tribu-v2.css?v=202611032209" />
    <link rel="stylesheet" href="tribu-pages.css?v=202611032209" />
    <style>
      .reg-wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; align-items: center; padding: 56px 0 80px; }
      .reg-copy h1 { font-size: clamp(34px, 4.4vw, 52px); line-height: 1.05; margin: 12px 0 16px; }
      .reg-copy h1 span { color: #D3AC00; }
      .reg-copy p { color: var(--muted); font-size: 17px; line-height: 1.6; }
      .reg-list { list-style: none; padding: 0; margin: 22px 0 0; display: grid; gap: 12px; }
      .reg-list li { display: flex; gap: 10px; align-items: flex-start; font-weight: 600; color: var(--ink); }
      .reg-list li::before { content: "✓"; flex: none; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: rgba(211,172,0,.15); color: #8a6a00; font-size: 13px; }
      .reg-card { background: rgba(255,255,255,.72); backdrop-filter: blur(16px) saturate(160%); -webkit-backdrop-filter: blur(16px) saturate(160%); border: 1px solid rgba(255,255,255,.9); border-radius: 24px; padding: 32px; box-shadow: 0 20px 50px -24px rgba(15,23,42,.3); }
      .reg-card h2 { font-size: 22px; margin: 0 0 4px; } .reg-card .sub { color: var(--muted); font-size: 14px; margin: 0 0 20px; }
      .fld { display: grid; gap: 6px; margin-bottom: 14px; }
      .fld label { font-size: 13px; font-weight: 600; color: #334155; }
      .fld input, .fld select { width: 100%; padding: 13px 14px; border-radius: 12px; border: 1.5px solid #f0ede2; background: #fff; font: inherit; font-size: 15px; color: #0f172a; outline: none; transition: border-color .2s, box-shadow .2s; }
      .fld input:focus, .fld select:focus { border-color: #D3AC00; box-shadow: 0 0 0 4px rgba(211,172,0,.16); }
      .fld .err { display: none; font-size: 12.5px; color: #c49e08; }
      .fld.bad input, .fld.bad select { border-color: #ef4444; } .fld.bad .err { display: block; }
      .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      .chk { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; color: #475569; line-height: 1.5; margin: 10px 0; }
      .chk input { flex: none; width: 18px; height: 18px; margin-top: 2px; accent-color: #D3AC00; }
      .chk a { color: #8a6a00; font-weight: 600; text-decoration: underline; }
      .chk.bad { color: #c49e08; }
      .reg-btn { width: 100%; margin-top: 10px; min-height: 52px; border-radius: 999px; border: 0; background: #e5b909; color: #fff; font: 700 16px/1 inherit; cursor: pointer; box-shadow: 0 12px 26px -12px rgba(229, 185, 9,.7); }
      .reg-btn:disabled { opacity: .6; cursor: wait; }
      .reg-note { font-size: 12px; color: #94a3b8; text-align: center; margin-top: 12px; }
      .reg-ok { display: none; text-align: center; padding: 20px 0; } .reg-ok h2 { font-size: 24px; }
      .reg-msg { display: none; margin-top: 10px; font-size: 13px; color: #c49e08; text-align: center; }
      @media (max-width: 900px) { .reg-wrap { grid-template-columns: 1fr; gap: 28px; padding-top: 32px; } .row2 { grid-template-columns: 1fr; } .reg-card { padding: 24px 18px; } }
    </style>
  </head>
  <body class="v2 page">
    <site-header></site-header>
    <main class="container">
      <div class="reg-wrap" style="grid-template-columns:1fr;max-width:460px;margin:0 auto">
        <div class="reg-card">
          <form id="ncForm" novalidate>
            <h2>Crea una nueva contraseña</h2>
            <p class="sub">Mínimo 8 caracteres, con letras y números.</p>
            <div class="fld"><label for="nPass">Nueva contraseña</label><input id="nPass" type="password" autocomplete="new-password" required /></div>
            <div class="fld"><label for="nPass2">Repite la contraseña</label><input id="nPass2" type="password" autocomplete="new-password" required /></div>
            <button class="reg-btn" id="ncBtn" type="submit">Guardar contraseña</button>
            <p class="reg-msg" id="ncMsg"></p>
          </form>
        </div>
      </div>
    </main>
    <site-footer></site-footer>
    <script src="components.js?v=202611032209"></script>
    <script>
      const $ = (id) => document.getElementById(id);
      const msg = (t, good) => { const m = $('ncMsg'); m.textContent = t; m.style.display = 'block'; m.style.color = good ? '#15803d' : ''; };
      $('ncForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const p = $('nPass').value;
        if (p.length < 8 || !/[A-Za-z]/.test(p) || !/\d/.test(p)) return msg('La contraseña debe tener mínimo 8 caracteres, con letras y números.');
        if (p !== $('nPass2').value) return msg('Las contraseñas no coinciden.');
        if (!window.tribuAuth || !tribuAuth.configured) return msg('El sistema de cuentas aún se está configurando.');
        await tribuAuth.ready;
        if (!tribuAuth.user) return msg('El enlace venció. Pide uno nuevo desde "¿Olvidaste tu contraseña?".');
        const { error } = await tribuAuth.updatePassword(p);
        if (error) return msg('No pudimos guardar la contraseña. Intenta de nuevo.');
        msg('¡Listo! Tu contraseña se actualizó.', true);
        setTimeout(() => (location.href = 'videos.html'), 1200);
      });
    </script>
  </body>
</html>
